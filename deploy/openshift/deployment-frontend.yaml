apiVersion: apps/v1
kind: Deployment
metadata:
  name: kueue-dashboard-frontend
  labels:
    app: kueue-dashboard
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kueue-dashboard
      component: frontend
  template:
    metadata:
      labels:
        app: kueue-dashboard
        component: frontend
    spec:
      imagePullSecrets:
        - name: quay-pull-secret
      containers:
        - name: frontend
          image: quay.io/<your-org>/kueue-dashboard-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: VITE_API_URL
              value: ""  # Empty means use same origin (proxied through nginx)
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
