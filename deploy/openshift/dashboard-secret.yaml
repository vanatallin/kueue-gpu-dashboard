# Generate secrets before applying:
#   OAUTH_CLIENT_SECRET: must match the OAuthClient resource secret
#   SESSION_SECRET: openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: kueue-dashboard-config
  labels:
    app: kueue-dashboard
type: Opaque
stringData:
  OAUTH_CLIENT_ID: "kueue-dashboard"
  OAUTH_CLIENT_SECRET: "<must-match-oauthclient-secret>"
  SESSION_SECRET: "<generate-with-openssl-rand-base64-32>"
